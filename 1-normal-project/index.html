<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Loading... - Hostel Complaint Management System</title>
  <link rel="stylesheet" href="style.css" />

  <style>
  
    .splash-page {
      min-height: 100vh;
      background-color: var(--navy-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .splash-logo {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 40px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .splash-logo span {
      color: var(--gold);
    }

    .splash-tagline {
      color: #d9dee5;
      font-size: 14px;
      margin-bottom: 34px;
      letter-spacing: 0.5px;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid var(--gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <section class="splash-page">
    <div class="splash-logo">Hostel<span>Care</span></div>
    <p class="splash-tagline">Hostel Complaint Management System</p>
    <div class="spinner"></div>
  </section>

  <script>
    setTimeout(function () {
      window.location.replace("login.html");
    }, 2500);
  </script>

</body>
</html>
